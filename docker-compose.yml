services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: richgame
      POSTGRES_USER: richgame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U richgame -d richgame"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: richgame
      POSTGRES_USER: richgame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_game && exec gunicorn --bind 0.0.0.0:8000 richgame.wsgi:application
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 4s
      timeout: 5s
      retries: 25

volumes:
  postgres-data:
  uploads:
